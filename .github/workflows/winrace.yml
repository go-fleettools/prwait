name: winrace-probe
on:
  push:
    branches: [winrace]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: probe
        env:
          PROBE_ROUNDS: "300"
        run: go test -race -count=1 -run 'TestWinRaceProbe' -v ./...
